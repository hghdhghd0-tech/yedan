/* 레이아웃: 학생 화면은 태블릿 한 손 조작용 단일 열(최대 640px), 교사 화면은 탭 + 최대 980px 본문. 면과 그림자로 구역을 나누고 테두리는 쓰지 않음 */
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F0F5F2; --surface-3:#E6EEEA;
  --ink:#13211B; --muted:#56675F; --faint:#8E9E97;
  --mint:#10B981; --mint-ink:#047857; --mint-soft:#E2F6EE; --mint-deep:#065F46;
  --before:#9DAAA4; --before-ink:#5F6E67;
  --warn:#9A5B05; --warn-soft:#FDF1D6; --danger:#B4233F; --danger-soft:#FCE7EB;
  --lv1:#E9A3AE; --lv2:#F5CDD4; --lv3:#DDE5E1; --lv4:#8FDDBE; --lv5:#10B981;
  --shadow-sm:0 1px 2px rgba(19,52,38,.05),0 1px 4px rgba(19,52,38,.06);
  --shadow-md:0 6px 18px rgba(19,52,38,.08),0 2px 6px rgba(19,52,38,.05);
  --shadow-lg:0 14px 34px rgba(19,52,38,.12);
  --r:16px;
  --font:"Pretendard Sub","Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"Pretendard Sub","Pretendard Variable",Pretendard,ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#141F1B; --surface-2:#1A2823; --surface-3:#22332D;
  --ink:#E4F0EA; --muted:#9DB0A7; --faint:#6E8279;
  --mint:#34D399; --mint-ink:#6EE7B7; --mint-soft:#11372A; --mint-deep:#A7F3D0;
  --before:#5E7068; --before-ink:#A9BAB2;
  --warn:#F5C35B; --warn-soft:#352A0F; --danger:#FB8DA0; --danger-soft:#3A1520;
  --lv1:#B85C6B; --lv2:#5E3138; --lv3:#33433D; --lv4:#2F8C6A; --lv5:#34D399;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 6px 18px rgba(0,0,0,.4); --shadow-lg:0 14px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141F1B; --surface-2:#1A2823; --surface-3:#22332D;
  --ink:#E4F0EA; --muted:#9DB0A7; --faint:#6E8279;
  --mint:#34D399; --mint-ink:#6EE7B7; --mint-soft:#11372A; --mint-deep:#A7F3D0;
  --before:#5E7068; --before-ink:#A9BAB2;
  --warn:#F5C35B; --warn-soft:#352A0F; --danger:#FB8DA0; --danger-soft:#3A1520;
  --lv1:#B85C6B; --lv2:#5E3138; --lv3:#33433D; --lv4:#2F8C6A; --lv5:#34D399;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 6px 18px rgba(0,0,0,.4); --shadow-lg:0 14px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3;letter-spacing:-.01em}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--mint-ink)}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* 공통 버튼 */
.btn{appearance:none;border:0;border-radius:var(--r);padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer;background:var(--surface-2);color:var(--ink);transition:all .2s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);filter:brightness(1.03)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--mint);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#062B1F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#062B1F}}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--surface-2);box-shadow:none}
.btn.small{min-height:36px;padding:7px 14px;font-size:14px}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;filter:none}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:24px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;background:var(--mint-soft);color:var(--mint-ink);white-space:nowrap}
.pill.gray{background:var(--surface-2);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.hint{font-size:14px;color:var(--muted)}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.input{width:100%;border:0;background:var(--surface-2);border-radius:var(--r);padding:13px 16px;font-size:17px;min-height:50px;transition:all .2s ease}
.input:focus{background:var(--surface-3);outline:3px solid var(--mint);outline-offset:0}
textarea.input{min-height:96px;resize:vertical;line-height:1.55}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--surface-2);border-radius:var(--r);padding:5px}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:all .2s ease;min-height:40px}
.seg button:hover{color:var(--ink)}
.seg button:active{transform:scale(.95)}
.seg button.on{background:var(--surface);color:var(--mint-ink);box-shadow:var(--shadow-sm)}

/* ===== 학생 화면 ===== */
.s-wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.s-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand-mark{width:28px;height:28px;flex:none}
.intro h1{font-size:clamp(24px,6vw,30px);font-weight:800;margin-bottom:10px}
.intro p.lead{color:var(--muted);font-size:16px}
.intro .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.intro .stack{display:grid;gap:16px;margin-top:20px}
.callout{background:var(--mint-soft);color:var(--mint-deep);border-radius:var(--r);padding:16px 18px;font-size:15px}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout b{font-weight:800}
.progress{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .3s ease}
.step-meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-weight:600;margin-top:-6px}
.comp-head{padding:6px 2px 0}
.comp-head .eyebrow{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--mint-ink)}
.comp-head h2{font-size:clamp(24px,6vw,28px);font-weight:800;margin:2px 0 4px}
.comp-head p{color:var(--muted)}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:600}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block}
.q{display:grid;gap:16px}
.q-text{font-size:17px;font-weight:600;line-height:1.55;display:flex;gap:10px}
.q-no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
.scale-row{display:grid;gap:8px}
.scale-row .who{font-size:13px;font-weight:800;color:var(--muted)}
.scale-row .who.now{color:var(--mint-ink)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dot{appearance:none;border:0;border-radius:var(--r);background:var(--surface-2);min-height:52px;font-weight:800;font-size:17px;cursor:pointer;transition:all .2s ease;color:var(--muted)}
.dot:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);color:var(--ink)}
.dot:active{transform:scale(.95)}
.dot.on{background:var(--mint);color:#fff;box-shadow:var(--shadow-md)}
.scale.then .dot.on{background:var(--before-ink);color:var(--surface)}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--faint);font-weight:600}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.nav .btn.primary{flex:1;max-width:320px;margin-left:auto}
.foot{text-align:center;font-size:13px;color:var(--faint);padding-top:12px}
.foot a{color:var(--faint)}
.done-hero{text-align:center;display:grid;gap:8px;justify-items:center}
.done-hero h1{font-size:clamp(24px,6vw,30px);font-weight:800}
.radar-wrap{display:grid;justify-items:center}
.radar{width:100%;max-width:400px;height:auto}
.radar text{fill:var(--muted);font-size:15px;font-weight:700;font-family:var(--font)}
.strength{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.strength .card{padding:18px;box-shadow:none;background:var(--surface-2)}
.strength .k{font-size:13px;font-weight:800;color:var(--muted)}
.strength .v{font-size:20px;font-weight:800;margin-top:2px}
.status{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.status.ok{color:var(--mint-ink)}
.status.bad{color:var(--danger)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--mint);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 교사 화면 ===== */
.t-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
body.teacher::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.t-top-in{max-width:980px;margin:0 auto;padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}

<script type="text/plain" id="gs-code">/** @OnlyCurrentDoc */
/**
 * 어울림 성장 진단 — 응답 저장용 Apps Script (구글 시트에 붙여 쓰는 코드)
 * 1) 구글 시트를 새로 만들고 [확장 프로그램] → [Apps Script]를 엽니다.
 * 2) 원래 있던 코드를 지우고 이 코드를 전부 붙여넣은 뒤 READ_KEY를 바꿉니다.
 * 3) [배포] → [새 배포] → 유형 '웹 앱' → 실행 계정 '나' / 액세스 권한 '모든 사용자' → [배포]
 * 4) 나오는 웹 앱 URL(…/exec)을 앱의 [연결 설정]에 붙여넣습니다.
 * 학생 응답에는 이름이 없고 학급·번호·점수·소감만 저장됩니다.
 * 응답을 읽을 때는 READ_KEY가 필요하므로 학생 링크로는 결과를 볼 수 없습니다.
 */
const READ_KEY = '여기에-교사용-열람키를-적으세요';
const SHEET_NAME = '응답';
const N_ITEMS = 18;
const N_SAT = 3;

function header_() {
  const h = ['제출시각', '기록ID', '학급', '번호', '방식'];
  for (let i = 1; i <= N_ITEMS; i++) h.push('A' + i);
  for (let i = 1; i <= N_ITEMS; i++) h.push('B' + i);
  for (let i = 1; i <= N_SAT; i++) h.push('S' + i);
  h.push('기억에남는활동', '달라진점');
  return h;
}

function sheet_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(SHEET_NAME);
  if (!sh) sh = ss.insertSheet(SHEET_NAME);
  if (sh.getLastRow() === 0) {
    sh.appendRow(header_());
    sh.setFrozenRows(1);
  }
  return sh;
}

// 글자는 앞에 ' 를 붙여 그대로 저장(1-3이 날짜로 바뀌거나 수식으로 실행되는 것을 막음)
function text_(v) {
  if (v === null || v === undefined) return '';
  return "'" + String(v).slice(0, 300);
}

function score_(v) {
  const n = Number(v);
  return n >= 1 && n <= 5 ? Math.round(n) : '';
}

function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const d = JSON.parse(e.postData.contents);
    const sh = sheet_();
    const last = sh.getLastRow();
    if (last > 1) {
      const ids = sh.getRange(2, 2, last - 1, 1).getValues().map(function (r) { return String(r[0]); });
      if (ids.indexOf(String(d.id)) !== -1) return out_({ ok: true, dup: true });
    }
    const row = [new Date(), text_(d.id), text_(d.cls), Number(d.num) || '', text_(d.phase)];
    for (let i = 0; i < N_ITEMS; i++) row.push(score_(d.a && d.a[i]));
    for (let i = 0; i < N_ITEMS; i++) row.push(score_(d.b && d.b[i]));
    for (let i = 0; i < N_SAT; i++) row.push(score_(d.s && d.s[i]));
    row.push(text_(d.q1), text_(d.q2));
    sh.appendRow(row);
    return out_({ ok: true });
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }
}

function doGet(e) {
  const p = (e && e.parameter) || {};
  if (String(p.key || '') !== READ_KEY) return out_({ ok: false, error: 'KEY' });
  const values = sheet_().getDataRange().getValues();
  const rows = values.slice(1).map(function (r) {
    return {
      ts: r[0], id: r[1], cls: r[2], num: r[3], phase: r[4],
      a: r.slice(5, 5 + N_ITEMS),
      b: r.slice(5 + N_ITEMS, 5 + 2 * N_ITEMS),
      s: r.slice(5 + 2 * N_ITEMS, 5 + 2 * N_ITEMS + N_SAT),
      q1: r[5 + 2 * N_ITEMS + N_SAT], q2: r[6 + 2 * N_ITEMS + N_SAT]
    };
  });
  return out_({ ok: true, rows: rows });
}
</script>

/* ---------------- 이벤트 ---------------- */
function route() {
  if (location.hash === '#teacher') { S.preview = false; renderTeacher(); }
  else renderStudent();
}
function goStep(i) { S.step = Math.max(0, Math.min(S.flow.length - 1, i)); renderStudent(); window.scrollTo(0, 0); }

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  switch (act) {
    case 'phase': S.phase = el.getAttribute('data-p'); buildFlow(); resetAnswers(); renderStudent(); break;
    case 'begin':
      S.cls = normCls(document.getElementById('s-cls').value);
      S.num = String(document.getElementById('s-num').value || '').trim();
      if (!S.cls) { toast('우리 반을 적어 주세요. 예: 1-3'); return; }
      if (!/^\d{1,2}$/.test(S.num) || +S.num < 1) { toast('번호를 숫자로 적어 주세요.'); return; }
      buildFlow(); goStep(1); break;
    case 'rate': {
      var k = el.getAttribute('data-k'), i = +el.getAttribute('data-i'), v = +el.getAttribute('data-v');
      S[k][i] = v;
      var grp = el.parentNode;
      Array.prototype.forEach.call(grp.children, function (b) { var on = +b.getAttribute('data-v') === v; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
      var nx = document.querySelector('[data-act="next"]');
      if (nx) nx.disabled = !stepDone(S.flow[S.step]);
      break; }
    case 'prev': goStep(S.step - 1); break;
    case 'next':
      if (!stepDone(S.flow[S.step])) return;
      if (S.flow[S.step + 1] === 'done') submit();
      goStep(S.step + 1); break;
    case 'resend': S.send = 'sending'; renderStudent(); send(); break;
    case 'restart': resetAnswers(); S.num = ''; buildFlow(); goStep(0); break;
    case 'exit-preview': S.preview = false; break;
    case 'tab': e.preventDefault(); T.tab = el.getAttribute('data-tab'); if (location.hash !== '#teacher') location.hash = '#teacher'; else renderTeacher(); window.scrollTo(0, 0); break;
    case 'source': loadSource(el.getAttribute('data-src')); break;
    case 'cls': T.cls = el.getAttribute('data-v'); renderTeacher(); break;
    case 'design': T.design = el.getAttribute('data-v'); renderTeacher(); break;
    case 'quote': toggleQuote(el); break;
    case 'copy': { var src = document.getElementById(el.getAttribute('data-src')); if (src) copyText(src.textContent, el); break; }
    case 'csv-dl': downloadCSV(); break;
    case 'csv-copy': copyText(toCSV(filtered()), el); break;
    case 'csv-load': {
      var txt = document.getElementById('csv-text').value;
      importCSV(txt); break; }
    case 'clear': T.confirmClear = true; renderTeacher(); break;
    case 'clear-no': T.confirmClear = false; renderTeacher(); break;
    case 'clear-yes': save(KEY.rec, []); T.confirmClear = false; loadSource('local'); toast('이 기기의 응답을 지웠어요.'); break;
    case 'lphase': T.linkPhase = el.getAttribute('data-p'); renderTeacher(); break;
    case 'preview':
      S.preview = true; S.cls = normCls(T.linkCls) || '1-1'; S.phase = T.linkPhase; S.api = ''; S.locked = true; S.num = '';
      resetAnswers(); buildFlow(); S.step = 0; location.hash = '#preview'; window.scrollTo(0, 0); break;
    case 'cfg-save': saveCfg(); break;
  }
});
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.quote')) { e.preventDefault(); toggleQuote(e.target); }
});
document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 's-q1') S.q1 = e.target.value;
  else if (id === 's-q2') S.q2 = e.target.value;
  else if (id === 's-cls' && !S.locked) S.cls = e.target.value;
  else if (id === 's-num') S.num = e.target.value;
  else if (id === 'l-cls') { T.linkCls = e.target.value; var lb = document.getElementById('l-link'); if (lb) { lb.textContent = studentLink(); drawQR(); } }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'csv-file' && e.target.files && e.target.files[0]) {
    var fr = new FileReader();
    fr.onload = function () { importCSV(String(fr.result)); };
    fr.readAsText(e.target.files[0], 'utf-8');
  }
});
function toggleQuote(el) {
  var k = el.getAttribute('data-key');
  if (quoteSel[k]) delete quoteSel[k]; else quoteSel[k] = 1;
  save(KEY.quotes, quoteSel);
  var on = !!quoteSel[k];
  el.classList.toggle('on', on); el.setAttribute('aria-checked', on);
  var cnt = Object.keys(quoteSel).length;
  var hint = el.closest('section').querySelector('.sec-h .hint');
  if (hint) { var all = el.closest('.quotes').querySelectorAll('.quote.on').length; hint.textContent = '보고서에 인용할 소감을 눌러 고르세요 · ' + all + '개 선택'; }
  return cnt;
}
function importCSV(text) {
  try {
    var rows = parseCSV(text);
    if (!rows.length) { toast('불러올 응답을 찾지 못했어요.'); return; }
    T.source = 'file'; T.rows = rows; T.cls = 'all'; T.design = 'auto'; renderTeacher();
    toast('응답 ' + rows.length + '건을 불러왔어요.');
  } catch (err) { toast('첫 줄 제목이 맞지 않아요. 이 앱이나 구글 시트에서 내려받은 CSV인지 확인해 주세요.'); }
}
function downloadCSV() {
  var blob = new Blob([toCSV(filtered())], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '어울림성장진단_' + (T.cls === 'all' ? '전체' : T.cls) + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  toast('내려받기가 안 되면 [CSV 내용 복사]를 써 주세요.');
}
function saveCfg() {
  cfg.api = document.getElementById('c-api').value.trim();
  cfg.key = document.getElementById('c-key').value.trim();
  cfg.appUrl = document.getElementById('c-url').value.trim();
  save(KEY.cfg, cfg);
  if (!cfg.api) { T.connMsg = '저장했어요. 웹 앱 주소가 비어 있어 구글 시트는 쓰지 않아요.'; T.connOk = null; renderTeacher(); return; }
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(cfg.api)) { T.connMsg = '주소가 script.google.com으로 시작하는지 확인해 주세요.'; T.connOk = false; renderTeacher(); return; }
  if (!cfg.key) { T.connMsg = '저장했어요. 결과를 보려면 열람키도 적어 주세요.'; T.connOk = false; renderTeacher(); return; }
  T.connMsg = '확인하는 중…'; T.connOk = null; renderTeacher();
  fetchSheet().then(function (rows) { T.connMsg = '연결됐어요 · 지금까지 응답 ' + rows.length + '건'; T.connOk = true; T.source = ''; renderTeacher(); },
    function (err) { T.connMsg = err.message === 'KEY' ? '열람키가 맞지 않아요.' : '연결하지 못했어요. 배포 권한(모든 사용자)과 주소를 확인해 주세요. 미리 보기 페이지에서는 외부 연결이 막혀 있을 수 있어요.'; T.connOk = false; renderTeacher(); });
}

window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
