name: Deploy React to GitHub Pages

on:
  push:
    branches:
      - main # 내 기본 브랜치 이름이 'main'인지 확인해 주세요 (구버전은 master일 수 있습니다)

# 배포를 진행할 수 있는 권한을 부여합니다
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 일반 CRA 리액트 앱은 ./build / Vite로 만든 프로젝트라면 ./dist 로 수정해 주세요!
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
